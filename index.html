<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quant Options Pricing & Greeks Simulator</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem;
      display: flex;
      justify-content: center;
    }
    .container {
      max-width: 900px;
      width: 100%;
    }
    h1 {
      font-size: 1.5rem;
      color: var(--accent);
      margin-bottom: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
    }
    .card h2 {
      font-size: 1.1rem;
      margin-top: 0;
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.5rem;
    }
    .input-group {
      margin-bottom: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    label {
      font-size: 0.85rem;
      color: var(--muted);
    }
    input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.4rem 0.6rem;
      border-radius: 4px;
      width: 90px;
      text-align: right;
      font-weight: bold;
    }
    .metric {
      display: flex;
      justify-content: space-between;
      padding: 0.4rem 0;
      border-bottom: 1px dashed var(--border);
      font-size: 0.9rem;
    }
    .metric:last-child {
      border-bottom: none;
    }
    .val {
      font-weight: bold;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Quant Options Pricing Engine</h1>
    <div class="grid">
      <div class="card">
        <h2>Market Inputs</h2>
        <div class="input-group">
          <label for="spot">Underlying Price ($S$)</label>
          <input type="number" id="spot" value="100" step="1" />
        </div>
        <div class="input-group">
          <label for="strike">Strike Price ($K$)</label>
          <input type="number" id="strike" value="100" step="1" />
        </div>
        <div class="input-group">
          <label for="days">Days to Expiration ($T$)</label>
          <input type="number" id="days" value="30" step="1" />
        </div>
        <div class="input-group">
          <label for="vol">Implied Volatility ($\sigma$ %)</label>
          <input type="number" id="vol" value="25" step="1" />
        </div>
        <div class="input-group">
          <label for="rate">Risk-Free Rate ($r$ %)</label>
          <input type="number" id="rate" value="5" step="0.1" />
        </div>
      </div>

      <div class="card">
        <h2>Call Option</h2>
        <div class="metric"><span>Price</span><span id="call-price" class="val">0.00</span></div>
        <div class="metric"><span>Delta ($\Delta$)</span><span id="call-delta" class="val">0.00</span></div>
        <div class="metric"><span>Gamma ($\Gamma$)</span><span id="call-gamma" class="val">0.00</span></div>
        <div class="metric"><span>Theta ($\Theta$)</span><span id="call-theta" class="val">0.00</span></div>
        <div class="metric"><span>Vega ($\nu$)</span><span id="call-vega" class="val">0.00</span></div>
        <div class="metric"><span>Rho ($\rho$)</span><span id="call-rho" class="val">0.00</span></div>
      </div>

      <div class="card">
        <h2>Put Option</h2>
        <div class="metric"><span>Price</span><span id="put-price" class="val">0.00</span></div>
        <div class="metric"><span>Delta ($\Delta$)</span><span id="put-delta" class="val">0.00</span></div>
        <div class="metric"><span>Gamma ($\Gamma$)</span><span id="put-gamma" class="val">0.00</span></div>
        <div class="metric"><span>Theta ($\Theta$)</span><span id="put-theta" class="val">0.00</span></div>
        <div class="metric"><span>Vega ($\nu$)</span><span id="put-vega" class="val">0.00</span></div>
        <div class="metric"><span>Rho ($\rho$)</span><span id="put-rho" class="val">0.00</span></div>
      </div>
    </div>
  </div>
